name: clang-cl

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    if: "!contains(github.event.pull_request.title, '[only-') || contains(github.event.pull_request.title, '[only-clang-cl]')"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os:
          # windows-latest's VS 2026 STL requires a newer clang-cl than the image ships
          # (STL1000: Unexpected compiler version, expected Clang 22 or newer)
          - windows-2022
        preset:
          - name: dev-clangcl
        with_spdlog:
          - true
          - false

    steps:
      - name: Install Qt ${{ matrix.preset.qt_version }} with options and default aqtversion
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.2"
          cache: true

      - name: Install ninja
        uses: turtlesec-no/get-ninja@main

      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Make sure MSVC is found when Ninja generator is in use
        if: ${{ runner.os == 'Windows' }}
        uses: KDABLabs/msvc-dev-cmd-action@v2

      # Cache vcpkg's built packages, so we don't rebuild them on every run.
      # Rebuilding downloads the ports' patches from github.com/<repo>/commit/<sha>.patch,
      # which sometimes returns 503 for hours.
      - name: Get vcpkg commit
        if: ${{ matrix.with_spdlog }}
        id: vcpkg
        shell: pwsh
        run: |
          "commit=$(git -C $env:VCPKG_INSTALLATION_ROOT rev-parse HEAD)" >> $env:GITHUB_OUTPUT
          New-Item -ItemType Directory -Force -Path "${{ github.workspace }}/vcpkg-binary-cache" | Out-Null

      - name: Restore vcpkg packages
        if: ${{ matrix.with_spdlog }}
        id: vcpkg-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ github.workspace }}/vcpkg-binary-cache
          key: vcpkg-${{ runner.os }}-${{ steps.vcpkg.outputs.commit }}-spdlog-fmt

      # Regression test for https://github.com/KDAB/KDDockWidgets/issues/733
      # (spdlog's Windows sink drags in <windows.h>, which clashes with our own
      # Core::HANDLE typedef when built with clang-cl).
      - name: Install spdlog via vcpkg
        if: ${{ matrix.with_spdlog }}
        shell: pwsh
        run: vcpkg install spdlog:x64-windows fmt:x64-windows
        env:
          VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-binary-cache

      # Save right away rather than at the end of the job, so a later failure doesn't lose a successful build
      - name: Save vcpkg packages
        if: ${{ matrix.with_spdlog && steps.vcpkg-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ github.workspace }}/vcpkg-binary-cache
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: Configure
        shell: pwsh
        run: |
          $extraArgs = @()
          if ("${{ matrix.with_spdlog }}" -eq "true") {
            $extraArgs += "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          } else {
            $extraArgs += "-DKDDockWidgets_NO_SPDLOG=ON"
          }
          cmake -S . -B ./build-${{ matrix.preset.name }} --preset ${{ matrix.preset.name }} -DCMAKE_INSTALL_PREFIX=install @extraArgs

      # Make sure the spdlog code path was actually exercised (or actually skipped),
      # so this job can't silently pass without ever compiling the code that
      # triggered issue #733.
      - name: Verify spdlog was actually enabled/disabled as expected
        shell: pwsh
        run: |
          $found = Select-String -Path ./build-${{ matrix.preset.name }}/compile_commands.json -Pattern "KDDW_HAS_SPDLOG" -Quiet
          if ("${{ matrix.with_spdlog }}" -eq "true" -and -not $found) {
            Write-Error "spdlog was expected to be enabled but KDDW_HAS_SPDLOG is not set"
            exit 1
          }
          if ("${{ matrix.with_spdlog }}" -eq "false" -and $found) {
            Write-Error "spdlog was expected to be disabled but KDDW_HAS_SPDLOG is set"
            exit 1
          }

      - name: Build
        run: cmake --build ./build-${{ matrix.preset.name }}

      - name: Install
        run: cmake --build ./build-${{ matrix.preset.name }} --target install

      - name: Run tests
        run: ctest --test-dir ./build-${{ matrix.preset.name }} --verbose -j 8
        env:
          QT_FORCE_STDERR_LOGGING: 1 # QtTest output goes to OutputDebugString on Windows otherwise
