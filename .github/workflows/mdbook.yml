name: Deploy mdBook site to Pages

on:
  push:
    branches: ["main"]

  # Redeploy when new coverage is available, so /coverage/ stays current
  workflow_run:
    workflows: ["Code coverage"]
    types: [completed]
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    if: "(github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') && (!contains(github.event.pull_request.title, '[only-') || contains(github.event.pull_request.title, '[only-mdbook]'))"
    runs-on: ubuntu-26.04
    env:
      MDBOOK_VERSION: 0.4.21
    steps:
      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
          profile: minimal
      - uses: actions/checkout@v7
      - name: Install mdBook
        run: |
          cargo install --version ${MDBOOK_VERSION} mdbook
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Build with mdBook
        run: mdbook build
      # Pages is one site per repo, so the coverage report is published as a subpath of the docs
      - name: Add coverage report
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh run list --workflow coverage.yml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          gh run download "$run_id" --name coverage-report --dir coverage-report
          mkdir -p book/coverage
          cp -r coverage-report/html/. book/coverage/
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./book

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-26.04
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
