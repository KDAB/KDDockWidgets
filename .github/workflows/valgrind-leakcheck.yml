# LSAN in qt6-asan.yml already catches leaks in the unit tests on every PR, so this runs nightly.

name: Valgrind leakcheck (nightly)

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: true
    steps:
      - name: Install Qt 6.6.0
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.6.0
          cache: true

      - name: Install dependencies
        run: |
          sudo apt update -qq
          sudo apt install mold ninja-build libspdlog-dev valgrind -y

      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Configure
        run: cmake --preset=dev -DKDDockWidgets_EXAMPLES=OFF

      - name: Build
        run: cmake --build build-dev --parallel

      - name: Run valgrind
        run: valgrind --leak-check=full --show-leak-kinds=all --gen-suppressions=all --error-exitcode=1 --exit-on-first-error=yes --suppressions=./valgrind.sup ./build-dev/bin/qtwidgets_leak_test -platform offscreen
